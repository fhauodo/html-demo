<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>备货计划新增 - 收货层级SKU维度原型</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d9e1ec;
      --line-strong: #c3cedd;
      --text: #1f2a37;
      --muted: #697586;
      --primary: #246bfe;
      --primary-weak: #eaf1ff;
      --green: #12805c;
      --green-weak: #e9f7f2;
      --amber: #a35c00;
      --amber-weak: #fff4dc;
      --red: #c93535;
      --red-weak: #fff0f0;
      --cyan: #0b7285;
      --cyan-weak: #e8f7fa;
      --shadow: 0 12px 32px rgba(23, 37, 84, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 14px;
    }

    button, input, select, textarea { font: inherit; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 50px 1fr;
    }

    .topbar {
      height: 50px;
      background: #f9fbff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 18px;
      color: #111827;
    }

    .brand {
      font-weight: 700;
      min-width: 180px;
    }

    .tabbar {
      display: flex;
      gap: 4px;
      align-items: stretch;
      height: 100%;
      flex: 1;
    }

    .tab {
      padding: 0 18px;
      display: flex;
      align-items: center;
      border-left: 1px solid transparent;
      border-right: 1px solid transparent;
      color: #344054;
      white-space: nowrap;
    }

    .tab.active {
      background: #fff;
      color: #1f5eff;
      border-color: var(--line);
      font-weight: 700;
    }

    .user {
      color: var(--muted);
      white-space: nowrap;
    }

    .workspace {
      padding: 22px 34px 28px;
    }

    .dialog {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      min-height: calc(100vh - 94px);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .dialog-header {
      height: 72px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close {
      border: 0;
      background: transparent;
      color: #8992a3;
      font-size: 24px;
      cursor: pointer;
      width: 36px;
      height: 36px;
    }

    .dialog-body {
      padding: 24px 26px 18px;
      overflow: auto;
    }

    .section {
      margin-bottom: 26px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 16px;
      color: #2b3645;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }

    .section-title::before { max-width: 24px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(210px, 1fr));
      gap: 16px 34px;
      align-items: start;
    }

    .field {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
      grid-template-columns: 112px 1fr;
    }

    .label {
      text-align: right;
      color: #4b5565;
      white-space: nowrap;
    }

    .required::before {
      content: "*";
      color: var(--red);
      margin-right: 4px;
    }

    .control,
    textarea {
      height: 34px;
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: 5px;
      padding: 0 10px;
      width: 100%;
      color: #243042;
      outline: none;
    }

    .control:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-weak);
    }

    .control[disabled] {
      background: #f1f4f8;
      color: #8a94a6;
    }

    textarea {
      min-height: 62px;
      padding: 10px 12px;
      resize: vertical;
    }

    .hint-row {
      margin: 12px 0 0 120px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #526071;
      white-space: nowrap;
    }

    .pill.info {
      border-color: #b8d7e2;
      background: var(--cyan-weak);
      color: var(--cyan);
    }

    .pill.warn {
      border-color: #f0cd82;
      background: var(--amber-weak);
      color: var(--amber);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      height: 34px;
      border-radius: 5px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #344054;
      padding: 0 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--primary); color: var(--primary); }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.ghost {
      background: #f8fafc;
    }

    .btn.danger:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .btn.icon {
      width: 32px;
      padding: 0;
      justify-content: center;
    }

    .table-wrap {
      border: 1px solid var(--line);
      overflow: auto;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 10px 10px;
      vertical-align: middle;
      height: 54px;
    }

    th:last-child,
    td:last-child { border-right: 0; }

    thead th {
      background: #f3f6fa;
      color: #313b4b;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    tbody tr:hover td {
      background: #fbfdff;
    }

    .check-col { width: 44px; text-align: center; }
    .sku-col { width: 230px; }
    .name-col { width: 180px; }
    .seller-col { width: 150px; }
    .code-col { width: 210px; }
    .level-col { width: 180px; }
    .stock-col { width: 90px; }
    .qty-col { width: 146px; }
    .action-col { width: 150px; }

    .cell-input,
    .cell-select {
      width: 100%;
      height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 0 8px;
      outline: none;
      background: #fff;
      color: #243042;
    }

    .cell-input:focus,
    .cell-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-weak);
    }

    .sku-main .cell-select {
      font-weight: 400;
    }

    .sku-search-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .sku-suggest-list {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 10;
      display: none;
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(23, 37, 84, .14);
    }

    .sku-suggest-list.show {
      display: block;
    }

    .sku-suggest-item {
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 400;
      border-bottom: 1px solid #eef2f7;
    }

    .sku-suggest-item:last-child {
      border-bottom: 0;
    }

    .sku-suggest-item:hover {
      background: var(--primary-weak);
      color: var(--primary);
    }

    .sku-suggest-name {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .sku-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }

    .qty-stepper {
      display: grid;
      grid-template-columns: 32px 1fr 32px;
      width: 100%;
    }

    .qty-stepper button,
    .qty-stepper input {
      height: 32px;
      border: 1px solid var(--line-strong);
      background: #fff;
    }

    .qty-stepper button {
      cursor: pointer;
      color: #617084;
    }

    .qty-stepper button:first-child {
      border-radius: 5px 0 0 5px;
    }

    .qty-stepper button:last-child {
      border-radius: 0 5px 5px 0;
    }

    .qty-stepper input {
      border-left: 0;
      border-right: 0;
      text-align: center;
      outline: none;
      min-width: 0;
    }

    .row-error td {
      background: var(--red-weak);
    }

    .row-error:hover td {
      background: #ffe8e8;
    }

    .sku-group-row td {
      background: #f8fbff;
      font-weight: 700;
    }

    .sku-group-row:hover td {
      background: #f1f6ff;
    }

    .level-child-row td {
      background: #fff;
    }

    .level-child-row td:first-child,
    .level-child-row td:nth-child(2) {
      background: #fbfdff;
    }

    .expand-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      border-radius: 3px;
      cursor: pointer;
      color: #667085;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 22px;
      padding: 0;
    }

    .expand-btn:hover {
      background: #eaf1ff;
      color: var(--primary);
    }

    .sku-main {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .chevron {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 6px solid currentColor;
      transform: rotate(0deg);
      transition: transform .16s ease;
    }

    .expand-btn.expanded .chevron {
      transform: rotate(90deg);
    }

    .child-indent {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      padding-left: 34px;
      font-weight: 400;
    }

    .total-qty {
      font-size: 18px;
      color: #172033;
    }

    .error-text {
      color: var(--red);
      font-size: 12px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .dialog-footer {
      min-height: 64px;
      border-top: 1px solid var(--line);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 26px;
      gap: 12px;
    }

    .footer-left {
      color: var(--muted);
      font-size: 13px;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
    }

    .toast {
      position: fixed;
      right: 28px;
      bottom: 24px;
      min-width: 260px;
      max-width: 420px;
      background: #172033;
      color: #fff;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: .18s ease;
      z-index: 20;
      line-height: 1.5;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .45);
      z-index: 30;
      padding: 24px;
    }

    .modal-mask.show {
      display: flex;
    }

    .import-modal {
      width: 640px;
      max-width: 100%;
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, .22);
    }

    .import-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      font-weight: 700;
    }

    .import-body {
      padding: 28px 56px 34px;
    }

    .import-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      align-items: start;
      gap: 12px;
      margin-bottom: 18px;
      color: #344054;
    }

    .import-link {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
    }

    .upload-box {
      height: 150px;
      border: 1px dashed var(--line-strong);
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #667085;
      cursor: pointer;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background: #f8fbff;
    }

    .upload-icon {
      font-size: 44px;
      line-height: 1;
      color: #98a2b3;
      margin-bottom: 12px;
    }

    .upload-help {
      margin-left: 92px;
      margin-top: -8px;
      color: #697586;
      font-size: 12px;
    }

    .import-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 22px 18px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 1280px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(230px, 1fr));
      }

    }

    @media (max-width: 760px) {
      .workspace { padding: 12px; }
      .dialog-header, .dialog-body, .dialog-footer { padding-left: 14px; padding-right: 14px; }
      .form-grid { grid-template-columns: 1fr; }
      .field, .field.full {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .label { text-align: left; }
      .hint-row { margin-left: 0; }
      .dialog-footer { align-items: stretch; flex-direction: column; }
      .footer-actions { justify-content: flex-end; flex-wrap: wrap; }
      .tabbar { overflow: auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">退货管理</div>
      <nav class="tabbar">
        <div class="tab active">备货计划</div>
        <div class="tab">发货通知单</div>
        <div class="tab">FBA货件计划</div>
        <div class="tab">分销发货申请单</div>
        <div class="tab">层级库存</div>
        <div class="tab">店铺管理</div>
        <div class="tab">收货列表</div>
      </nav>
      <div class="user">017163</div>
    </header>

    <main class="workspace">
      <section class="dialog">
        <div class="dialog-header">
          <div class="dialog-title">新增备货计划</div>
          <button class="close" title="关闭">×</button>
        </div>

        <div class="dialog-body">
          <section class="section">
            <div class="section-title">基本信息</div>
            <div class="form-grid">
              <label class="field">
                <span class="label">计划单号：</span>
                <input class="control" value="系统自动生成" disabled />
              </label>
              <label class="field">
                <span class="label required">第三方仓服务商：</span>
                <select class="control" id="provider">
                  <option>其他</option>
                  <option>谷仓</option>
                  <option>万邑通</option>
                </select>
              </label>
              <label class="field">
                <span class="label required">始发仓：</span>
                <select class="control" id="fromWh">
                  <option>成品仓</option>
                  <option>深圳仓</option>
                  <option>东莞仓</option>
                </select>
              </label>
              <label class="field">
                <span class="label required">目的仓：</span>
                <select class="control" id="toWh">
                  <option>SPL仓</option>
                  <option>欧洲央仓</option>
                  <option>英国仓</option>
                </select>
              </label>
              <label class="field">
                <span class="label required">运输方式：</span>
                <select class="control" id="transport">
                  <option value="">请选择</option>
                  <option>海运</option>
                  <option>空运</option>
                  <option>铁路</option>
                  <option>卡航</option>
                </select>
              </label>
              <label class="field">
                <span class="label">是否已知装箱信息：</span>
                <select class="control" id="knownBox">
                  <option>否</option>
                  <option>是</option>
                </select>
              </label>
              <label class="field">
                <span class="label required">期望发货时间：</span>
                <input class="control" id="shipDate" type="date" />
              </label>
              <label class="field">
                <span class="label required">发货库存层级：</span>
                <select class="control" id="fromLevel">
                  <option>公共</option>
                  <option>法国虚拟仓</option>
                  <option>德国虚拟仓</option>
                  <option>西班牙虚拟仓</option>
                </select>
              </label>
              <label class="field">
                <span class="label required">期望上架日期：</span>
                <input class="control" id="putawayDate" type="date" />
              </label>
              <label class="field">
                <span class="label">关联调拨发货单号：</span>
                <input class="control" id="shipmentNo" placeholder="自动回填或手工录入" />
              </label>
              <label class="field full">
                <span class="label">备注：</span>
                <textarea id="remark" maxlength="200" placeholder="请输入内容"></textarea>
              </label>
            </div>
            <div class="hint-row">
              <span class="pill info">收货库存层级已移动到计划明细行</span>
              <span class="pill">同一SKU可按不同收货层级拆多行</span>
              <span class="pill warn">保存时校验 SKU + 收货层级 不重复</span>
            </div>
          </section>

          <section class="section">
            <div class="section-title">计划明细</div>
            <div class="toolbar">
              <div class="toolbar-left">
                <button type="button" class="btn primary" id="openProductModal" onclick="handleAddProduct()">+ 添加产品</button>
                <button type="button" class="btn primary" id="importDemo">导入产品</button>
                <button type="button" class="btn ghost danger" id="removeSelected">批量移除</button>
              </div>
              <div class="toolbar-right">
                <span class="pill info" id="validState">待校验</span>
                <span class="pill" id="rowCount">0 行明细</span>
              </div>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="check-col"><input type="checkbox" id="checkAll" /></th>
                    <th class="sku-col"><span class="required">SKU </span></th>
                    <th class="name-col">产品名称</th>
                    <th class="seller-col">sellerSku</th>
                    <th class="code-col"><span class="required">目的仓第三方仓产品代码</span></th>
                    <th class="level-col"><span class="required">收货库存层级</span></th>
                    <th class="stock-col">可用库存</th>
                    <th class="qty-col"><span class="required">计划数量</span></th>
                    <th class="action-col">操作</th>
                  </tr>
                </thead>
                <tbody id="detailBody"></tbody>
              </table>
            </div>
          </section>
        </div>

        <div class="dialog-footer">
          <div class="footer-left" id="footerTip">收货库存层级在SKU行填写，用于后续货权归属和责任追溯。</div>
          <div class="footer-actions">
            <button class="btn">取消</button>
            <button class="btn ghost" id="saveDraft">暂存为草稿</button>
            <button class="btn primary" id="savePlan">保存</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-mask" id="importModal">
    <div class="import-modal">
      <div class="import-header">
        <span>导入备货计划</span>
        <button class="close" type="button" id="closeImportModal">×</button>
      </div>
      <div class="import-body">
        <div class="import-row">
          <span>模板下载：</span>
          <a class="import-link" id="downloadTemplate">↓ 点击下载</a>
        </div>
        <div class="import-row">
          <span>文件上传：</span>
          <div class="upload-box" id="uploadBox">
            <div class="upload-icon">☁</div>
            <div>将文件拖到此处，或<span class="import-link">点击上传</span></div>
            <input id="importFile" type="file" accept=".xls,.xlsx" hidden />
          </div>
        </div>
        <div class="upload-help" id="uploadHelp">请上传 .xls、.xlsx 标准格式文件，文件最大为 5M</div>
      </div>
      <div class="import-footer">
        <button class="btn ghost" type="button" id="cancelImport">取消</button>
        <button class="btn primary" type="button" id="confirmImport">确定</button>
      </div>
    </div>
  </div>

  <script>
    const levels = ["公共", "法国虚拟仓", "德国虚拟仓", "西班牙虚拟仓", "英国虚拟仓"];
    const products = [
      { sku: "S806-MN-BK-UK-000-AZ", name: "Shokz_OpenRun USB-C Black", sellerSku: "OPENRUN-BK-UK", code: "SPL-S806-BK", stock: 0 },
      { sku: "S810-MN-BG-EU-001-AZ", name: "Shokz_OpenFit Beige EU", sellerSku: "OPENFIT-BG-EU", code: "SPL-S810-BG", stock: 128 },
      { sku: "S811-MN-GY-EU-002-AZ", name: "Shokz_OpenComm2 Grey", sellerSku: "OPENCOMM2-GY", code: "SPL-S811-GY", stock: 76 },
      { sku: "S900-MN-BK-EU-003-AZ", name: "Shokz_OpenSwim Pro Black", sellerSku: "OPENSWIMPRO-BK", code: "SPL-S900-BK", stock: 240 }
    ];

    let idSeq = 1;

    function createId() {
      idSeq += 1;
      return `row-${Date.now()}-${idSeq}`;
    }

    let rows = [
      {
        id: createId(),
        checked: false,
        sku: "S806-MN-BK-UK-000-AZ",
        name: "Shokz_OpenRun USB-C Black",
        sellerSku: "OPENRUN-BK-UK",
        code: "SPL-S806-BK",
        receiveLevel: "法国虚拟仓",
        stock: 0,
        qty: 100
      },
      {
        id: createId(),
        checked: false,
        sku: "S806-MN-BK-UK-000-AZ",
        name: "Shokz_OpenRun USB-C Black",
        sellerSku: "OPENRUN-BK-UK",
        code: "SPL-S806-BK",
        receiveLevel: "德国虚拟仓",
        stock: 0,
        qty: 200
      },
      {
        id: createId(),
        checked: false,
        sku: "S806-MN-BK-UK-000-AZ",
        name: "Shokz_OpenRun USB-C Black",
        sellerSku: "OPENRUN-BK-UK",
        code: "SPL-S806-BK",
        receiveLevel: "西班牙虚拟仓",
        stock: 0,
        qty: 150
      }
    ];

    const detailBody = document.getElementById("detailBody");
    const toast = document.getElementById("toast");
    const expandedSku = new Set(["S806-MN-BK-UK-000-AZ"]);

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getSkuTotals() {
      return rows.reduce((map, row) => {
        const qty = Number(row.qty) || 0;
        const key = row.sku || row.id;
        if (!map[key]) map[key] = 0;
        map[key] += qty;
        return map;
      }, {});
    }

    function rowGroupKey(row) {
      return row.sku || row.id;
    }

    function getDuplicateKeys() {
      const seen = new Map();
      const duplicates = new Set();
      rows.forEach(row => {
        const key = `${row.sku}__${row.receiveLevel}`;
        if (seen.has(key)) duplicates.add(key);
        seen.set(key, true);
      });
      return duplicates;
    }

    function getGroups() {
      const grouped = rows.reduce((map, row) => {
        const key = rowGroupKey(row);
        if (!map[key]) {
          map[key] = {
            key,
            sku: row.sku,
            name: row.name,
            sellerSku: row.sellerSku,
            code: row.code,
            stock: row.stock,
            total: 0,
            rows: []
          };
        }
        const qty = Number(row.qty) || 0;
        map[key].total += qty;
        map[key].rows.push(row);
        return map;
      }, {});
      return Object.values(grouped);
    }

    function validateRows() {
      const duplicates = getDuplicateKeys();
      const errors = new Map();
      rows.forEach(row => {
        const itemErrors = [];
        if (!row.sku) itemErrors.push("SKU不能为空");
        if (!row.code) itemErrors.push("目的仓第三方仓产品代码不能为空");
        if (!row.receiveLevel) itemErrors.push("收货库存层级不能为空");
        if (!row.qty || Number(row.qty) <= 0) itemErrors.push("计划数量必须大于0");
        if (duplicates.has(`${row.sku}__${row.receiveLevel}`)) itemErrors.push("SKU+收货库存层级重复");
        if (itemErrors.length) errors.set(row.id, itemErrors[0]);
      });
      return errors;
    }

    function renderRows() {
      const totals = getSkuTotals();
      const errors = validateRows();
      detailBody.innerHTML = getGroups().map(group => {
        const groupHasError = group.rows.some(row => errors.has(row.id));
        const groupChecked = group.rows.every(row => row.checked);
        const expanded = expandedSku.has(group.key);
        const levelSummary = group.rows.map(row => row.receiveLevel).filter(Boolean).join("，") || "未选择";
        const parentRow = `
          <tr class="sku-group-row ${groupHasError ? "row-error" : ""}" data-sku="${escapeHtml(group.sku)}" data-group-key="${escapeHtml(group.key)}">
            <td class="check-col"><input type="checkbox" data-action="checkSku" ${groupChecked ? "checked" : ""} /></td>
            <td class="sku-col">
              <div class="sku-main">
                <button class="expand-btn ${expanded ? "expanded" : ""}" data-action="toggleSku" title="${expanded ? "收起" : "展开"}">
                  <span class="chevron"></span>
                </button>
                <div class="sku-search-wrap">
                  <input
                    class="cell-input sku-search-input"
                    data-action="searchGroupSku"
                    data-group-key="${escapeHtml(group.key)}"
                    value="${escapeHtml(group.sku)}"
                    placeholder="输入SKU关键字搜索"
                    autocomplete="off"
                  />
                  <div class="sku-suggest-list" data-suggest-for="${escapeHtml(group.key)}"></div>
                </div>
              </div>
            </td>
            <td class="name-col"><span class="sku-text" title="${escapeHtml(group.name)}">${escapeHtml(group.name)}</span></td>
            <td class="seller-col"><span class="sku-text" title="${escapeHtml(group.sellerSku)}">${escapeHtml(group.sellerSku)}</span></td>
            <td class="code-col"><span class="sku-text" title="${escapeHtml(group.code)}">${escapeHtml(group.code)}</span></td>
            <td class="level-col">
              <span class="sku-text" title="${escapeHtml(levelSummary)}">${escapeHtml(levelSummary)}</span>
            </td>
            <td class="stock-col">${Number(group.stock) || 0}</td>
            <td class="qty-col"><span class="total-qty">${group.total}</span></td>
            <td class="action-col">
              <div class="action-group">
                <button class="btn icon" data-action="addLevel" title="新增虚拟层级">＋</button>
                <button class="btn icon" data-action="deleteSku" title="删除SKU">×</button>
              </div>
            </td>
          </tr>
        `;
        const childRows = !expanded ? "" : group.rows.map(row => {
          const error = errors.get(row.id);
          return `
            <tr class="level-child-row ${error ? "row-error" : ""}" data-id="${row.id}" data-sku="${escapeHtml(row.sku)}">
              <td class="check-col"><input type="checkbox" data-action="check" ${row.checked ? "checked" : ""} /></td>
              <td class="sku-col">
                <span class="child-indent" title="${escapeHtml(row.sku)}">└ ${escapeHtml(row.sku)}</span>
                ${error ? `<div class="error-text" title="${escapeHtml(error)}">${escapeHtml(error)}</div>` : ""}
              </td>
              <td class="name-col"><span class="sku-text" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</span></td>
              <td class="seller-col"><span class="sku-text" title="${escapeHtml(row.sellerSku)}">${escapeHtml(row.sellerSku)}</span></td>
              <td class="code-col">
                <span class="sku-text" title="${escapeHtml(row.code || '请先维护目的仓产品代码配置')}">${escapeHtml(row.code || "请先维护配置")}</span>
              </td>
              <td class="level-col">
                <select class="cell-select" data-field="receiveLevel">
                  <option value="">请选择</option>
                  ${levels.map(level => `<option ${row.receiveLevel === level ? "selected" : ""}>${level}</option>`).join("")}
                </select>
              </td>
              <td class="stock-col">${Number(row.stock) || 0}</td>
              <td class="qty-col">
                <div class="qty-stepper">
                  <button data-action="minus">−</button>
                  <input data-field="qty" inputmode="numeric" value="${Number(row.qty) || 0}" />
                  <button data-action="plus">＋</button>
                </div>
              </td>
              <td class="action-col">
                <div class="action-group">
                  <button class="btn icon" data-action="delete" title="删除层级明细">×</button>
                </div>
              </td>
            </tr>
          `;
        }).join("");
        return parentRow + childRows;
      }).join("");

      document.getElementById("rowCount").textContent = `${rows.length} 行明细`;
      document.getElementById("checkAll").checked = rows.length > 0 && rows.every(row => row.checked);
      document.getElementById("validState").textContent = errors.size ? `${errors.size} 行待处理` : "校验通过";
      document.getElementById("validState").className = errors.size ? "pill warn" : "pill info";
    }

    function updateRow(id, patch) {
      rows = rows.map(row => row.id === id ? { ...row, ...patch } : row);
      renderRows();
    }

    function commitQtyInput(input) {
      const tr = input.closest("tr");
      if (!tr || input.dataset.field !== "qty") return;
      const value = Number(input.value.replace(/[^\d]/g, "") || 0);
      updateRow(tr.dataset.id, { qty: value });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2800);
    }

    function addProduct(product = {}, level = "", qty = 1) {
      const id = createId();
      rows.push({
        id,
        checked: false,
        sku: product.sku || "",
        name: product.name || "",
        sellerSku: product.sellerSku || "",
        code: product.code || "",
        receiveLevel: level,
        stock: product.stock || 0,
        qty
      });
      expandedSku.add(product.sku || id);
    }

    function applyProductToGroup(groupKey, sku) {
      const product = products.find(item => item.sku === sku);
      rows = rows.map(row => {
        if (rowGroupKey(row) !== groupKey) return row;
        if (!product) {
          return row;
        }
        return {
          ...row,
          sku: product.sku,
          name: product.name,
          sellerSku: product.sellerSku,
          code: product.code,
          stock: product.stock
        };
      });
      if (!product && sku) {
        showToast("请选择下拉候选中的SKU。");
        renderRows();
        return;
      }
      expandedSku.delete(groupKey);
      expandedSku.add(sku || groupKey);
      renderRows();
    }

    function closeSkuSuggestLists() {
      document.querySelectorAll(".sku-suggest-list").forEach(list => {
        list.classList.remove("show");
        list.innerHTML = "";
      });
    }

    function renderSkuSuggestions(input) {
      const keyword = input.value.trim().toLowerCase();
      const wrap = input.closest(".sku-search-wrap");
      const list = wrap.querySelector(".sku-suggest-list");
      const matched = products.filter(product => {
        const text = `${product.sku} ${product.name} ${product.sellerSku}`.toLowerCase();
        return !keyword || text.includes(keyword);
      });

      list.innerHTML = matched.length
        ? matched
            .map(product => `
              <div class="sku-suggest-item" data-sku="${escapeHtml(product.sku)}">
                ${escapeHtml(product.sku)}
                <span class="sku-suggest-name">${escapeHtml(product.name)}</span>
              </div>
            `)
            .join("")
        : '<div class="sku-suggest-item">无匹配SKU</div>';
      list.classList.add("show");
    }

    function createNewProduct() {
      const existingSkus = new Set(rows.map(row => row.sku));
      const unused = products.find(product => !existingSkus.has(product.sku));
      if (unused) return unused;
      const seq = products.length + rows.length + 1;
      return {
        sku: `NEW-SKU-${String(seq).padStart(3, "0")}`,
        name: "新增产品",
        sellerSku: `SELLER-${String(seq).padStart(3, "0")}`,
        code: "",
        stock: 0
      };
    }

    function nextAvailableLevel(sku) {
      const used = new Set(rows.filter(row => row.sku === sku).map(row => row.receiveLevel));
      return levels.find(level => !used.has(level)) || levels[0];
    }

    detailBody.addEventListener("input", event => {
      if (event.target.dataset.action === "searchGroupSku") {
        renderSkuSuggestions(event.target);
        return;
      }
      const tr = event.target.closest("tr");
      if (!tr) return;
      const id = tr.dataset.id;
      const field = event.target.dataset.field;
      if (!field) return;
      if (field === "qty") {
        event.target.value = event.target.value.replace(/[^\d]/g, "");
        return;
      }
      const value = event.target.value;
      updateRow(id, { [field]: value });
    });

    detailBody.addEventListener("change", event => {
      const tr = event.target.closest("tr");
      if (!tr) return;
      const sku = tr.dataset.sku;
      const groupKey = tr.dataset.groupKey;
      const id = tr.dataset.id;
      if (event.target.dataset.action === "checkSku") {
        rows = rows.map(row => rowGroupKey(row) === groupKey ? { ...row, checked: event.target.checked } : row);
        renderRows();
        return;
      }
      if (event.target.dataset.action === "check") {
        updateRow(id, { checked: event.target.checked });
        return;
      }
      const field = event.target.dataset.field;
      if (field === "qty") {
        commitQtyInput(event.target);
        return;
      }
      if (field) updateRow(id, { [field]: event.target.value });
    });

    detailBody.addEventListener("keydown", event => {
      if (event.target.dataset.field !== "qty" || event.key !== "Enter") return;
      event.preventDefault();
      commitQtyInput(event.target);
    });

    detailBody.addEventListener("focusin", event => {
      if (event.target.dataset.action === "searchGroupSku") {
        renderSkuSuggestions(event.target);
      }
    });

    detailBody.addEventListener("click", event => {
      const suggestItem = event.target.closest(".sku-suggest-item[data-sku]");
      if (suggestItem) {
        const wrap = suggestItem.closest(".sku-search-wrap");
        const input = wrap.querySelector(".sku-search-input");
        applyProductToGroup(input.dataset.groupKey, suggestItem.dataset.sku);
        closeSkuSuggestLists();
        return;
      }

      if (event.target.dataset.action === "searchGroupSku") {
        renderSkuSuggestions(event.target);
        return;
      }

      const button = event.target.closest("button");
      if (!button) return;
      const tr = button.closest("tr");
      const sku = tr.dataset.sku;
      const groupKey = tr.dataset.groupKey;
      const id = tr.dataset.id;
      const action = button.dataset.action;
      if (action === "toggleSku") {
        if (expandedSku.has(groupKey)) expandedSku.delete(groupKey);
        else expandedSku.add(groupKey);
        renderRows();
        return;
      }
      if (action === "addLevel") {
        const first = rows.find(item => rowGroupKey(item) === groupKey);
        if (!first) return;
        if (!first.sku) {
          showToast("请先选择SKU，再新增收货虚拟层级。");
          return;
        }
        rows.push({ ...first, id: createId(), checked: false, receiveLevel: "", qty: 1 });
        expandedSku.add(groupKey);
        renderRows();
        showToast("已新增该SKU的收货虚拟层级明细。");
        return;
      }
      if (action === "deleteSku") {
        const count = rows.filter(item => rowGroupKey(item) === groupKey).length;
        rows = rows.filter(item => rowGroupKey(item) !== groupKey);
        expandedSku.delete(groupKey);
        renderRows();
        showToast(`已删除 ${count} 行SKU层级明细。`);
        return;
      }
      const row = rows.find(item => item.id === id);
      if (!row) return;
      if (action === "minus") updateRow(id, { qty: Math.max(0, Number(row.qty || 0) - 1) });
      if (action === "plus") updateRow(id, { qty: Number(row.qty || 0) + 1 });
      if (action === "delete") {
        rows = rows.filter(item => item.id !== id);
        if (!rows.some(item => item.sku === row.sku)) expandedSku.delete(row.sku);
        renderRows();
      }
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".sku-search-wrap")) {
        closeSkuSuggestLists();
      }
    });

    document.getElementById("checkAll").addEventListener("change", event => {
      rows = rows.map(row => ({ ...row, checked: event.target.checked }));
      renderRows();
    });

    document.getElementById("removeSelected").addEventListener("click", () => {
      const count = rows.filter(row => row.checked).length;
      rows = rows.filter(row => !row.checked);
      renderRows();
      showToast(count ? `已移除 ${count} 行明细。` : "请先选择需要移除的明细。");
    });

    const splitSelectedButton = document.getElementById("splitSelected");
    if (splitSelectedButton) {
      splitSelectedButton.addEventListener("click", () => {
        const selectedSkus = Array.from(new Set(rows.filter(row => row.checked).map(row => row.sku)));
        if (selectedSkus.length !== 1) {
          showToast("请选择一个SKU，为它新增收货虚拟层级。");
          return;
        }
        const sku = selectedSkus[0];
        const row = rows.find(item => item.sku === sku);
      rows.push({ ...row, id: createId(), checked: false, receiveLevel: "", qty: 1 });
        expandedSku.add(sku);
        renderRows();
        showToast("已新增该SKU的收货虚拟层级明细。");
      });
    }

    const importModal = document.getElementById("importModal");
    const importFile = document.getElementById("importFile");
    const uploadHelp = document.getElementById("uploadHelp");

    function openImportModal() {
      importModal.classList.add("show");
    }

    function closeImportModal() {
      importModal.classList.remove("show");
      importFile.value = "";
      uploadHelp.textContent = "请上传 .xls、.xlsx 标准格式文件，文件最大为 5M";
    }

    function importDemoRows() {
      addProduct(products[1], "公共", 80);
      addProduct(products[1], "英国虚拟仓", 120);
      renderRows();
      showToast("已导入示例产品，并按不同收货层级拆行。");
    }

    document.getElementById("importDemo").addEventListener("click", openImportModal);

    document.getElementById("closeImportModal").addEventListener("click", closeImportModal);
    document.getElementById("cancelImport").addEventListener("click", closeImportModal);
    importModal.addEventListener("click", event => {
      if (event.target === importModal) closeImportModal();
    });

    document.getElementById("downloadTemplate").addEventListener("click", () => {
      showToast("已模拟下载导入模板。");
    });

    document.getElementById("uploadBox").addEventListener("click", () => {
      importFile.click();
    });

    importFile.addEventListener("change", () => {
      const file = importFile.files && importFile.files[0];
      uploadHelp.textContent = file ? `已选择文件：${file.name}` : "请上传 .xls、.xlsx 标准格式文件，文件最大为 5M";
    });

    document.getElementById("confirmImport").addEventListener("click", () => {
      importDemoRows();
      closeImportModal();
    });

    document.getElementById("saveDraft").addEventListener("click", () => {
      showToast("草稿已暂存。当前原型不会写入后端。");
    });

    document.getElementById("savePlan").addEventListener("click", () => {
      const baseErrors = [];
      if (!document.getElementById("transport").value) baseErrors.push("运输方式不能为空");
      if (!document.getElementById("shipDate").value) baseErrors.push("期望发货时间不能为空");
      if (!document.getElementById("putawayDate").value) baseErrors.push("期望上架日期不能为空");
      const rowErrors = validateRows();
      renderRows();
      if (baseErrors.length || rowErrors.size) {
        showToast([baseErrors[0], rowErrors.size ? `${rowErrors.size} 行明细未通过校验` : ""].filter(Boolean).join("；"));
        return;
      }
      showToast("保存成功。已按SKU维度记录收货库存层级。");
    });

    function handleAddProduct() {
      try {
        addProduct({}, "", 1);
        renderRows();
        showToast("已新增一行汇总SKU，请选择SKU、收货库存层级并填写计划数量。");
      } catch (error) {
        alert(`添加产品失败：${error.message || error}`);
      }
    }

    try {
      renderRows();
    } catch (error) {
      alert(`页面初始化失败：${error.message || error}`);
    }
  </script>
</body>
</html>
