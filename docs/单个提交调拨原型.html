<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提交调拨发货 - 复用计划明细设计原型</title>
  <style>
    :root {
      --bg: #eef1f6;
      --panel: #fff;
      --line: #e6eaf0;
      --line-strong: #d7dde7;
      --header: #f3f6fa;
      --text: #243042;
      --muted: #7a8494;
      --disabled: #f4f6fa;
      --primary: #246bfe;
      --primary-weak: #eaf1ff;
      --primary-hover: #1b58d6;
      --red: #d9363e;
      --red-weak: #fff2f2;
      --warn: #a35c00;
      --warn-weak: #fff4dc;
      --shadow: 0 16px 42px rgba(17, 25, 40, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 12px;
    }

    button,
    input,
    select,
    textarea { font: inherit; }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 18px 10px;
    }

    .dialog {
      width: min(1240px, calc(100vw - 20px));
      max-height: calc(100vh - 36px);
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr) 58px;
      overflow: hidden;
      background: var(--panel);
      border-radius: 1px;
      box-shadow: var(--shadow);
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      font-size: 15px;
      font-weight: 600;
    }

    .close {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #9aa3b2;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .dialog-body {
      overflow: auto;
      padding: 16px 20px 18px;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .section-title::after {
      content: "";
      height: 1px;
      background: var(--line);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(210px, 1fr));
      column-gap: 28px;
      row-gap: 12px;
      align-items: start;
    }

    .field {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .field.wide {
      grid-column: span 2;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .label {
      color: #667085;
      text-align: right;
      white-space: nowrap;
    }

    .label.required::before,
    .required::before {
      content: "*";
      margin-right: 2px;
      color: var(--red);
    }

    .control,
    textarea {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      color: #344054;
      padding: 0 9px;
      outline: none;
    }

    textarea {
      height: 42px;
      padding: 8px 10px;
      resize: none;
      line-height: 1.5;
    }

    .control[disabled],
    textarea[disabled],
    .cell-input[disabled],
    .cell-select[disabled] {
      background: var(--disabled);
      color: #8b95a6;
      cursor: not-allowed;
    }

    .control:focus,
    textarea:focus,
    .cell-input:focus,
    .cell-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(36, 107, 254, .12);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #667085;
      white-space: nowrap;
    }

    .pill.info {
      border-color: #b8d7e2;
      background: #e8f7fa;
      color: #0b7285;
    }

    .pill.warn {
      border-color: #f0cd82;
      background: var(--warn-weak);
      color: var(--warn);
    }

    .btn {
      height: 30px;
      min-width: 58px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: #fff;
      color: #475467;
      padding: 0 12px;
      cursor: pointer;
    }

    .btn:hover {
      border-color: #b9c1d0;
      color: #1f2937;
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    .btn.ghost {
      background: #f8fafc;
    }

    .btn.icon {
      min-width: 28px;
      width: 28px;
      padding: 0;
    }

    .table-wrap {
      border: 1px solid var(--line);
      overflow: auto;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1410px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      height: 48px;
      padding: 8px 10px;
      vertical-align: middle;
    }

    th:last-child,
    td:last-child { border-right: 0; }

    thead th {
      background: var(--header);
      color: #313b4b;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    tbody tr:hover td {
      background: #fbfdff;
    }

    .sku-col { width: 230px; }
    .name-col { width: 180px; }
    .seller-col { width: 150px; }
    .code-col { width: 210px; }
    .level-col { width: 160px; }
    .stock-col { width: 90px; }
    .qty-col { width: 130px; }

    .cell-input,
    .cell-select {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      padding: 0 8px;
      outline: none;
      background: #fff;
      color: #243042;
    }

    .sku-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }

    .sku-group-row td {
      background: #f8fbff;
      font-weight: 700;
    }

    .sku-group-row:hover td {
      background: #f1f6ff;
    }

    .level-child-row td {
      background: #fff;
    }

    .level-child-row td:first-child {
      background: #fbfdff;
    }

    .row-error td {
      background: var(--red-weak) !important;
    }

    .expand-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      border-radius: 3px;
      cursor: pointer;
      color: #667085;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 22px;
      padding: 0;
    }

    .expand-btn:hover {
      background: var(--primary-weak);
      color: var(--primary);
    }

    .chevron {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 6px solid currentColor;
      transform: rotate(0deg);
      transition: transform .16s ease;
    }

    .expand-btn.expanded .chevron {
      transform: rotate(90deg);
    }

    .sku-main {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
    }

    .child-indent {
      display: block;
      padding-left: 30px;
      color: #697586;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .qty-stepper {
      display: grid;
      grid-template-columns: 30px 1fr 30px;
      width: 100%;
    }

    .qty-stepper button,
    .qty-stepper input {
      height: 30px;
      border: 1px solid var(--line-strong);
      background: #fff;
    }

    .qty-stepper button {
      cursor: pointer;
      color: #617084;
    }

    .qty-stepper input {
      border-left: 0;
      border-right: 0;
      text-align: center;
      outline: none;
      min-width: 0;
    }

    .error-text {
      margin-top: 4px;
      color: var(--red);
      font-size: 11px;
      white-space: nowrap;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 20px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .footer-left {
      color: #667085;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      min-width: 260px;
      max-width: 420px;
      padding: 11px 13px;
      border-radius: 2px;
      background: #111827;
      color: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
      line-height: 1.5;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .18s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <header class="dialog-header">
        <div class="dialog-title" id="dialogTitle">提交调拨发货</div>
        <button class="close" type="button" id="closeBtn" title="关闭">×</button>
      </header>

      <main class="dialog-body">
        <section class="section">
          <div class="section-title">基本信息</div>
          <div class="form-grid">
            <label class="field">
              <span class="label">计划单号：</span>
              <input class="control" value="SP260525000007" disabled />
            </label>
            <label class="field">
              <span class="label required">第三方仓服务商：</span>
              <select class="control" disabled><option>星马逊</option></select>
            </label>
            <label class="field">
              <span class="label required">始发仓：</span>
              <select class="control" disabled><option>江淮成品仓</option></select>
            </label>
            <label class="field">
              <span class="label required">目的仓：</span>
              <select class="control" disabled><option>德国亚马逊仓</option></select>
            </label>
            <label class="field">
              <span class="label required">运输方式：</span>
              <select class="control" disabled><option>空运</option></select>
            </label>
            <label class="field">
              <span class="label">是否已知装箱信息：</span>
              <select class="control" disabled><option>是</option></select>
            </label>
            <label class="field">
              <span class="label required">期望发货时间：</span>
              <input class="control" type="date" value="2026-05-27" />
            </label>
            <label class="field">
              <span class="label required">发货库存层级：</span>
              <select class="control" disabled><option>公共</option></select>
            </label>
            <label class="field">
              <span class="label required">收货库存层级：</span>
              <select class="control" disabled><option>按明细行填写</option></select>
            </label>
            <label class="field">
              <span class="label required">期望上架日期：</span>
              <input class="control" type="date" value="2026-06-09" />
            </label>
            <label class="field">
              <span class="label">关联调拨发货单号：</span>
              <input class="control" placeholder="自动生成" disabled />
            </label>
            <label class="field">
              <span class="label">是否在EVA建单：</span>
              <select class="control"><option>请选择</option><option>是</option><option>否</option></select>
            </label>
            <label class="field full">
              <span class="label">备注：</span>
              <textarea maxlength="200">5/26入库空运、立讯转移，空运</textarea>
            </label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">平台信息</div>
          <div class="form-grid">
            <label class="field">
              <span class="label required">销售店铺：</span>
              <select class="control" disabled><option>Amazon-DE</option></select>
            </label>
            <label class="field">
              <span class="label">起始地：</span>
              <select class="control" disabled><option>SHOKZ (SINGAPORE) PTE. LTD</option></select>
            </label>
            <label class="field wide">
              <span class="label">起始地详情：</span>
              <input class="control" value="Shiyan Street, Bao'an District Floors 1-4, Factory Building 26, Shenzhen, Guangdong, CN, 518108" disabled />
            </label>
            <label class="field wide">
              <span class="label required">货件名称：</span>
              <textarea disabled>AMZ-20260525-001</textarea>
            </label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">计划明细</div>
          <div class="toolbar">
            <div class="toolbar-left">
              <button type="button" class="btn primary" id="expandAll">全部展开</button>
              <button type="button" class="btn ghost" id="collapseAll">全部收起</button>
              <button type="button" class="btn ghost" id="fillAll">按待提交全量填充</button>
            </div>
            <div class="toolbar-right">
              <span class="pill info">在 SKU 汇总行填写本次提交调拨数量</span>
              <span class="pill">明细行按待提交调拨发货数量自动分配</span>
              <span class="pill" id="rowCount">0 行明细</span>
              <span class="pill info" id="validState">待校验</span>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="sku-col"><span class="required">SKU</span></th>
                  <th class="name-col">产品名称</th>
                  <th class="seller-col"><span class="required">sellerSku</span></th>
                  <th class="code-col"><span class="required">目的仓第三方仓产品代码</span></th>
                  <th class="level-col"><span class="required">收货库存层级</span></th>
                  <th class="stock-col">可用库存</th>
                  <th class="qty-col"><span class="required">计划数量</span></th>
                  <th class="qty-col">已提交调拨数量</th>
                  <th class="qty-col"><span class="required">本次提交调拨数量</span></th>
                  <th class="qty-col">待提交调拨发货数量</th>
                </tr>
              </thead>
              <tbody id="detailBody"></tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="dialog-footer">
        <div class="footer-left">本次提交调拨数量在 SKU 汇总维度填写，系统按各收货层级待提交调拨发货数量自动分配。</div>
        <div class="footer-actions">
          <button class="btn" type="button" id="cancelBtn">取消</button>
          <button class="btn primary" type="button" id="confirmBtn">确定</button>
        </div>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const detailBody = document.getElementById("detailBody");
    const toast = document.getElementById("toast");
    const expandedSku = new Set(["T921-ST-BK-EU-000-AZB", "T921-ST-GY-EU-000-AZB"]);

    let rows = [
      {
        id: "row-1",
        sku: "T921-ST-BK-EU-000-AZB",
        name: "Shokz_OpenFit 2+ Black",
        sellerSku: "T921BK-EU",
        code: "AMZ-DE-T921BK",
        receiveLevel: "法国虚拟仓",
        stock: 0,
        planQty: 72,
        submittedQty: 0,
        submitQty: 40,
        pendingShipQty: 72
      },
      {
        id: "row-2",
        sku: "T921-ST-BK-EU-000-AZB",
        name: "Shokz_OpenFit 2+ Black",
        sellerSku: "T921BK-EU",
        code: "AMZ-DE-T921BK",
        receiveLevel: "德国虚拟仓",
        stock: 0,
        planQty: 48,
        submittedQty: 0,
        submitQty: 32,
        pendingShipQty: 48
      },
      {
        id: "row-3",
        sku: "T921-ST-GY-EU-000-AZB",
        name: "Shokz_OpenFit 2+ Grey",
        sellerSku: "T921GY-EU",
        code: "AMZ-DE-T921GY",
        receiveLevel: "德国虚拟仓",
        stock: 0,
        planQty: 72,
        submittedQty: 0,
        submitQty: 72,
        pendingShipQty: 72
      },
      {
        id: "row-4",
        sku: "T921-ST-GY-EU-000-AZB",
        name: "Shokz_OpenFit 2+ Grey",
        sellerSku: "T921GY-EU",
        code: "AMZ-DE-T921GY",
        receiveLevel: "西班牙虚拟仓",
        stock: 0,
        planQty: 36,
        submittedQty: 12,
        submitQty: 0,
        pendingShipQty: 24
      }
    ];

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getGroups() {
      const map = new Map();
      rows.forEach(row => {
        if (!map.has(row.sku)) {
          map.set(row.sku, {
            key: row.sku,
            sku: row.sku,
            name: row.name,
            sellerSku: row.sellerSku,
            code: row.code,
            stock: row.stock,
            rows: []
          });
        }
        map.get(row.sku).rows.push(row);
      });
      return [...map.values()].map(group => ({
        ...group,
        planQty: group.rows.reduce((sum, row) => sum + Number(row.planQty || 0), 0),
        submittedQty: group.rows.reduce((sum, row) => sum + Number(row.submittedQty || 0), 0),
        submitQty: group.rows.reduce((sum, row) => sum + Number(row.submitQty || 0), 0),
        pendingShipQty: group.rows.reduce((sum, row) => sum + Number(row.pendingShipQty || 0), 0)
      }));
    }

    function allocateGroupSubmit(groupKey, submitQty) {
      const groupRows = rows.filter(row => row.sku === groupKey);
      const totalPending = groupRows.reduce((sum, row) => sum + Number(row.pendingShipQty || 0), 0);
      const target = Math.min(Math.max(Number(submitQty || 0), 0), totalPending);

      if (!target || !totalPending) {
        rows = rows.map(row => row.sku === groupKey ? { ...row, submitQty: 0 } : row);
        return;
      }

      const allocated = groupRows.map((row, index) => {
        const pending = Number(row.pendingShipQty || 0);
        const theory = target * pending / totalPending;
        return {
          id: row.id,
          index,
          pending,
          qty: Math.floor(theory),
          remainder: theory - Math.floor(theory)
        };
      });

      let left = target - allocated.reduce((sum, item) => sum + item.qty, 0);
      const sorted = [...allocated].sort((a, b) => {
        if (b.remainder !== a.remainder) return b.remainder - a.remainder;
        return b.pending - a.pending;
      });

      while (left > 0) {
        const item = sorted.find(candidate => candidate.qty < candidate.pending);
        if (!item) break;
        item.qty += 1;
        left -= 1;
      }

      const qtyById = new Map(allocated.map(item => [item.id, item.qty]));
      rows = rows.map(row => row.sku === groupKey ? { ...row, submitQty: qtyById.get(row.id) || 0 } : row);
    }

    function validateRows() {
      const errors = new Map();
      rows.forEach(row => {
        const itemErrors = [];
        if (!row.sellerSku) itemErrors.push("sellerSku不能为空");
        if (!row.code) itemErrors.push("目的仓第三方仓产品代码不能为空");
        if (!row.receiveLevel) itemErrors.push("收货库存层级不能为空");
        if (Number(row.submitQty || 0) > Number(row.pendingShipQty || 0)) itemErrors.push("不可超过待提交发货数量");
        if (itemErrors.length) errors.set(row.id, itemErrors[0]);
      });
      return errors;
    }

    function renderRows() {
      const errors = validateRows();
      detailBody.innerHTML = getGroups().map(group => {
        const expanded = expandedSku.has(group.key);
        const groupHasError = group.rows.some(row => errors.has(row.id));
        const levelSummary = group.rows.map(row => row.receiveLevel).filter(Boolean).join("，") || "未选择";
        const parentRow = `
          <tr class="sku-group-row ${groupHasError ? "row-error" : ""}" data-group-key="${escapeHtml(group.key)}">
            <td class="sku-col">
              <div class="sku-main">
                <button class="expand-btn ${expanded ? "expanded" : ""}" data-action="toggleSku" title="${expanded ? "收起" : "展开"}">
                  <span class="chevron"></span>
                </button>
                <span class="sku-text" title="${escapeHtml(group.sku)}">${escapeHtml(group.sku)}</span>
              </div>
            </td>
            <td class="name-col"><span class="sku-text" title="${escapeHtml(group.name)}">${escapeHtml(group.name)}</span></td>
            <td class="seller-col"><span class="sku-text" title="${escapeHtml(group.sellerSku)}">${escapeHtml(group.sellerSku)}</span></td>
            <td class="code-col"><span class="sku-text" title="${escapeHtml(group.code)}">${escapeHtml(group.code)}</span></td>
            <td class="level-col"><span class="sku-text" title="${escapeHtml(levelSummary)}">${escapeHtml(levelSummary)}</span></td>
            <td class="stock-col">${Number(group.stock) || 0}</td>
            <td class="qty-col">${group.planQty}</td>
            <td class="qty-col">${group.submittedQty}</td>
            <td class="qty-col">
              <div class="qty-stepper">
                <button type="button" data-action="groupMinus">−</button>
                <input data-field="groupSubmitQty" inputmode="numeric" value="${Number(group.submitQty) || 0}" />
                <button type="button" data-action="groupPlus">＋</button>
              </div>
            </td>
            <td class="qty-col">${group.pendingShipQty}</td>
          </tr>
        `;
        const childRows = !expanded ? "" : group.rows.map(row => {
          const error = errors.get(row.id);
          return `
            <tr class="level-child-row ${error ? "row-error" : ""}" data-id="${escapeHtml(row.id)}" data-group-key="${escapeHtml(group.key)}">
              <td class="sku-col">
                <span class="child-indent" title="${escapeHtml(row.sku)}">└ ${escapeHtml(row.sku)}</span>
                ${error ? `<div class="error-text" title="${escapeHtml(error)}">${escapeHtml(error)}</div>` : ""}
              </td>
              <td class="name-col"><span class="sku-text" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</span></td>
              <td class="seller-col"><span class="sku-text" title="${escapeHtml(row.sellerSku)}">${escapeHtml(row.sellerSku)}</span></td>
              <td class="code-col"><span class="sku-text" title="${escapeHtml(row.code)}">${escapeHtml(row.code)}</span></td>
              <td class="level-col"><span class="sku-text" title="${escapeHtml(row.receiveLevel)}">${escapeHtml(row.receiveLevel || "未选择")}</span></td>
              <td class="stock-col">${Number(row.stock) || 0}</td>
              <td class="qty-col">${Number(row.planQty) || 0}</td>
              <td class="qty-col">${Number(row.submittedQty) || 0}</td>
              <td class="qty-col">${Number(row.submitQty) || 0}</td>
              <td class="qty-col">${Number(row.pendingShipQty) || 0}</td>
            </tr>
          `;
        }).join("");
        return parentRow + childRows;
      }).join("");

      document.getElementById("rowCount").textContent = `${rows.length} 行明细`;
      document.getElementById("validState").textContent = errors.size ? `${errors.size} 行待处理` : "校验通过";
      document.getElementById("validState").className = errors.size ? "pill warn" : "pill info";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function commitGroupSubmitInput(input) {
      const parent = input.closest("tr[data-group-key]");
      if (!parent || input.dataset.field !== "groupSubmitQty") return;
      const value = Number(input.value.replace(/[^\d]/g, "") || 0);
      allocateGroupSubmit(parent.dataset.groupKey, value);
      renderRows();
    }

    detailBody.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const parent = button.closest("tr[data-group-key]");
      const groupKey = parent ? parent.dataset.groupKey : "";

      if (action === "toggleSku") {
        expandedSku.has(groupKey) ? expandedSku.delete(groupKey) : expandedSku.add(groupKey);
        renderRows();
      }

      if (action === "groupMinus") {
        const group = getGroups().find(item => item.key === groupKey);
        allocateGroupSubmit(groupKey, Math.max(0, Number(group.submitQty || 0) - 1));
        renderRows();
      }

      if (action === "groupPlus") {
        const group = getGroups().find(item => item.key === groupKey);
        allocateGroupSubmit(groupKey, Math.min(Number(group.pendingShipQty || 0), Number(group.submitQty || 0) + 1));
        renderRows();
      }
    });

    detailBody.addEventListener("input", event => {
      const target = event.target;
      if (target.dataset.field !== "groupSubmitQty") return;
      target.value = target.value.replace(/[^\d]/g, "");
    });

    detailBody.addEventListener("change", event => {
      const target = event.target;
      if (target.dataset.field !== "groupSubmitQty") return;
      commitGroupSubmitInput(target);
    });

    detailBody.addEventListener("keydown", event => {
      const target = event.target;
      if (target.dataset.field !== "groupSubmitQty" || event.key !== "Enter") return;
      event.preventDefault();
      commitGroupSubmitInput(target);
    });

    document.getElementById("expandAll").addEventListener("click", () => {
      getGroups().forEach(group => expandedSku.add(group.key));
      renderRows();
    });

    document.getElementById("collapseAll").addEventListener("click", () => {
      expandedSku.clear();
      renderRows();
    });

    document.getElementById("fillAll").addEventListener("click", () => {
      rows = rows.map(row => ({ ...row, submitQty: Number(row.pendingShipQty || 0) }));
      renderRows();
      showToast("已按待提交调拨发货数量填充本次提交数量。");
    });

    document.getElementById("confirmBtn").addEventListener("click", () => {
      if (document.activeElement && document.activeElement.dataset.field === "groupSubmitQty") {
        commitGroupSubmitInput(document.activeElement);
      }
      const errors = validateRows();
      const total = rows.reduce((sum, row) => sum + Number(row.submitQty || 0), 0);
      if (errors.size) {
        rows.forEach(row => expandedSku.add(row.sku));
        renderRows();
        showToast(`还有 ${errors.size} 行明细未通过校验。`);
        return;
      }
      if (total <= 0) {
        showToast("本次提交调拨数量合计必须大于 0。");
        return;
      }
      showToast(`提交成功：本次提交调拨发货数量 ${total}，收货层级明细将随单据传递。`);
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      showToast("已取消，本原型不会关闭页面。");
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      showToast("已点击关闭，本原型保留弹窗页面展示。");
    });

    renderRows();
  </script>
</body>
</html>
