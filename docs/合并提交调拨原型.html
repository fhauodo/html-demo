<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>合并提交调拨发货 - 计划明细优化原型</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #fff;
      --line: #e6e8ee;
      --line-strong: #d9dde6;
      --header: #f5f7fb;
      --text: #2f3542;
      --muted: #8a92a3;
      --disabled: #f3f5f9;
      --primary: #246bfe;
      --primary-weak: #eaf1ff;
      --primary-hover: #1b58d6;
      --green: #12805c;
      --green-weak: #e9f7f2;
      --amber: #a35c00;
      --amber-weak: #fff4dc;
      --red: #d9363e;
      --red-weak: #fff2f2;
      --shadow: 0 16px 42px rgba(17, 25, 40, .24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 12px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .mask {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 18px 12px;
    }

    .dialog {
      width: min(1240px, calc(100vw - 24px));
      max-height: calc(100vh - 34px);
      background: var(--panel);
      box-shadow: var(--shadow);
      border-radius: 1px;
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr) 58px;
      overflow: hidden;
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
    }

    .close {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #9aa3b2;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    .close:hover {
      color: #667085;
    }

    .dialog-body {
      overflow: auto;
      padding: 16px 20px 18px;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #303846;
      font-weight: 600;
    }

    .section-title::after {
      content: "";
      height: 1px;
      background: var(--line);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(210px, 1fr));
      column-gap: 28px;
      row-gap: 12px;
      align-items: start;
    }

    .field {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
      grid-template-columns: 112px minmax(0, 1fr);
    }

    .label {
      color: #667085;
      text-align: right;
      white-space: nowrap;
    }

    .label.required::before,
    .required-mark::before {
      content: "*";
      color: var(--red);
      margin-right: 2px;
    }

    .control,
    textarea {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      color: #344054;
      padding: 0 9px;
      outline: none;
      transition: border-color .16s, box-shadow .16s;
    }

    .control:focus,
    textarea:focus,
    .cell-input:focus,
    .cell-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(36, 107, 254, .12);
    }

    .control[disabled],
    textarea[disabled] {
      background: var(--disabled);
      color: #8b95a6;
      cursor: not-allowed;
    }

    textarea {
      height: 42px;
      padding: 8px 10px;
      resize: none;
      line-height: 1.5;
    }

    .textarea-wrap {
      position: relative;
    }

    .textarea-count {
      position: absolute;
      right: 8px;
      bottom: 4px;
      color: #98a2b3;
      pointer-events: none;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #667085;
      white-space: nowrap;
    }

    .pill.info {
      border-color: #b8d7e2;
      background: #e8f7fa;
      color: #0b7285;
    }

    .pill.warn {
      border-color: #f0cd82;
      background: var(--amber-weak);
      color: var(--amber);
    }

    .pill.ok {
      border-color: #b7e2d1;
      background: var(--green-weak);
      color: var(--green);
    }

    .table-wrap {
      border: 1px solid var(--line);
      overflow: auto;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1560px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      min-height: 38px;
      padding: 8px 9px;
      text-align: left;
      vertical-align: middle;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    thead th {
      background: var(--header);
      color: #344054;
      font-weight: 600;
      white-space: nowrap;
    }

    tbody tr:hover td {
      background: #f7fbff;
    }

    .plan-col { width: 150px; }
    .warehouse-col { width: 130px; }
    .date-col { width: 125px; }
    .mode-col { width: 105px; }
    .level-col { width: 125px; }
    .remark-col { width: 150px; }
    .sku-col { width: 180px; }
    .qty-col { width: 112px; }
    .wide-col { width: 190px; }

    .ellipsis {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cell-input,
    .cell-select {
      width: 100%;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      color: #344054;
      padding: 0 8px;
      outline: none;
    }

    .cell-input[disabled] {
      background: var(--disabled);
      color: #9aa3b2;
    }

    .num-input {
      text-align: right;
    }

    .main-row td {
      background: #fff;
    }

    .main-row.group-open td {
      background: #f8fbff;
      border-bottom-color: #dce8ff;
    }

    .child-row td {
      background: #fbfdff;
      color: #4b5565;
    }

    .child-row:hover td {
      background: #f6faff;
    }

    .row-error td {
      background: var(--red-weak) !important;
    }

    .row-warn td {
      background: #fffaf0 !important;
    }

    .expand-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      border-radius: 3px;
      cursor: pointer;
      color: #667085;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-right: 5px;
      vertical-align: middle;
    }

    .expand-btn:hover {
      background: var(--primary-weak);
      color: var(--primary);
    }

    .chevron {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 6px solid currentColor;
      transform: rotate(0deg);
      transition: transform .16s ease;
    }

    .expand-btn.expanded .chevron {
      transform: rotate(90deg);
    }

    .child-indent {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #697586;
      padding-left: 30px;
    }

    .error-text {
      margin-top: 4px;
      color: var(--red);
      font-size: 11px;
      white-space: nowrap;
    }

    .muted {
      color: var(--muted);
    }

    .calc-text {
      color: #475467;
      font-weight: 600;
    }

    .dialog-footer {
      border-top: 1px solid var(--line);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 20px;
    }

    .footer-left {
      color: #667085;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      height: 30px;
      min-width: 58px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: #fff;
      color: #475467;
      padding: 0 14px;
      cursor: pointer;
    }

    .btn:hover {
      border-color: #b9c1d0;
      color: #1f2937;
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    .btn.ghost {
      background: #f8fafc;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      min-width: 260px;
      max-width: 420px;
      padding: 11px 13px;
      border-radius: 2px;
      background: #111827;
      color: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
      line-height: 1.5;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .18s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
      }

    }

    @media (max-width: 720px) {
      .mask {
        padding: 8px;
      }

      .dialog {
        width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field,
      .field.full {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .label {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="mask" id="mask">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <header class="dialog-header">
        <div class="dialog-title" id="dialogTitle">合并提交调拨发货</div>
        <button class="close" type="button" id="closeBtn" title="关闭">×</button>
      </header>

      <main class="dialog-body">
        <section class="section">
          <div class="section-title">基本信息</div>
          <div class="form-grid">
            <label class="field">
              <span class="label required">第三方仓服务商：</span>
              <select class="control" disabled>
                <option>星马逊</option>
              </select>
            </label>
            <label class="field">
              <span class="label required">收货仓：</span>
              <select class="control" disabled>
                <option>德国星马逊仓</option>
              </select>
            </label>
            <label class="field">
              <span class="label required">运输方式：</span>
              <select class="control" disabled>
                <option>空运</option>
              </select>
            </label>
            <label class="field">
              <span class="label required">期望发货时间：</span>
              <input class="control" type="date" value="2026-05-27" />
            </label>
            <label class="field">
              <span class="label required">期望上架时间：</span>
              <input class="control" type="date" value="2026-06-12" />
            </label>
            <label class="field full">
              <span class="label">备注：</span>
              <span class="textarea-wrap">
                <textarea id="remark" maxlength="1000" placeholder="请输入备注">合并 SP-001、SP-002、SP-003 提交调拨，目的仓统一为德国星马逊仓。</textarea>
                <span class="textarea-count" id="remarkCount">0 / 1000</span>
              </span>
            </label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">计划明细</div>

          <div class="toolbar">
            <div class="toolbar-left">
              <button class="btn ghost" type="button" id="expandAll">全部展开</button>
              <button class="btn ghost" type="button" id="collapseAll">全部收起</button>
              <button class="btn ghost" type="button" id="autoFill">按待提交全量填充</button>
            </div>
            <div class="toolbar-right">
              <span class="pill info">主行按“备货计划 + SKU”填写</span>
              <span class="pill">展开查看收货层级实时分配</span>
              <span class="pill">目的仓保持一致后才可合并</span>
              <span class="pill ok">调拨单全量发货</span>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="sku-col">SKU</th>
                  <th class="plan-col">备货计划</th>
                  <th class="warehouse-col">始发仓</th>
                  <th class="warehouse-col">目的仓</th>
                  <th class="date-col">期望发货时间</th>
                  <th class="mode-col">运输方式</th>
                  <th class="level-col">发货层级</th>
                  <th class="level-col">收货层级</th>
                  <th class="qty-col">待提交调拨发货数量</th>
                  <th class="qty-col">可用数量</th>
                  <th class="qty-col"><span class="required-mark">本次提交数量</span></th>
                  <th class="remark-col">备注</th>
                  <th class="wide-col">目的仓第三方仓产品代码</th>
                </tr>
              </thead>
              <tbody id="detailBody"></tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="dialog-footer">
        <div class="footer-left" id="footerTip">填写本次提交数量后，系统会按该备货计划 + SKU 下各收货层级待提交数量占比实时分配。</div>
        <div class="footer-actions">
          <button class="btn" type="button" id="cancelBtn">取消</button>
          <button class="btn primary" type="button" id="confirmBtn">确定</button>
        </div>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const detailBody = document.getElementById("detailBody");
    const toast = document.getElementById("toast");
    const remark = document.getElementById("remark");
    const remarkCount = document.getElementById("remarkCount");

    const rows = [
      {
        id: "SP-001__SKU-A",
        expanded: true,
        planNo: "SP-001",
        fromWarehouse: "成品仓",
        toWarehouse: "德国星马逊仓",
        expectedShipDate: "2025-10-10",
        transportMode: "海运散货",
        fromLevel: "公共",
        remark: "韩国naver需求",
        sku: "SKU-A",
        skuName: "OpenFit Air Black",
        productCode: "8020300152",
        availableQty: 0,
        submitQty: 70,
        levels: [
          { level: "法国虚拟仓", planQty: 100, submittedQty: 20 },
          { level: "德国虚拟仓", planQty: 80, submittedQty: 30 }
        ]
      },
      {
        id: "SP-001__SKU-B",
        expanded: false,
        planNo: "SP-001",
        fromWarehouse: "成品仓",
        toWarehouse: "德国星马逊仓",
        expectedShipDate: "2025-10-10",
        transportMode: "海运散货",
        fromLevel: "公共",
        remark: "韩国naver需求",
        sku: "SKU-B",
        skuName: "OpenRun Pro Grey",
        productCode: "8021000010",
        availableQty: 0,
        submitQty: 20,
        levels: [
          { level: "西班牙虚拟仓", planQty: 60, submittedQty: 0 }
        ]
      },
      {
        id: "SP-002__SKU-A",
        expanded: false,
        planNo: "SP-002",
        fromWarehouse: "成品仓",
        toWarehouse: "德国星马逊仓",
        expectedShipDate: "2025-10-20",
        transportMode: "海运散货",
        fromLevel: "公共",
        remark: "韩国售后需求，深圳发货",
        sku: "SKU-A",
        skuName: "OpenFit Air Black",
        productCode: "S810-ST-BL-KR-000-ASR",
        availableQty: 0,
        submitQty: 100,
        levels: [
          { level: "西班牙虚拟仓", planQty: 200, submittedQty: 80 }
        ]
      },
      {
        id: "SP-002__SKU-C",
        expanded: false,
        planNo: "SP-002",
        fromWarehouse: "成品仓",
        toWarehouse: "德国星马逊仓",
        expectedShipDate: "2025-10-20",
        transportMode: "海运散货",
        fromLevel: "公共",
        remark: "韩国售后需求，深圳发货",
        sku: "SKU-C",
        skuName: "OpenSwim Pro Blue",
        productCode: "S810-ST-BL-KR-000-ASR",
        availableQty: 0,
        submitQty: 50,
        levels: [
          { level: "法国虚拟仓", planQty: 90, submittedQty: 0 }
        ]
      },
      {
        id: "SP-003__SKU-A",
        expanded: false,
        planNo: "SP-003",
        fromWarehouse: "成品仓",
        toWarehouse: "德国星马逊仓",
        expectedShipDate: "2025-10-20",
        transportMode: "海运散货",
        fromLevel: "公共",
        remark: "韩国售后需求，深圳发货",
        sku: "SKU-A",
        skuName: "OpenFit Air Black",
        productCode: "S803-ST-GY-KR-000-ASR",
        availableQty: 0,
        submitQty: 60,
        levels: [
          { level: "法国虚拟仓", planQty: 150, submittedQty: 60 }
        ]
      },
      {
        id: "SP-003__SKU-D",
        expanded: false,
        planNo: "SP-003",
        fromWarehouse: "成品仓",
        toWarehouse: "德国星马逊仓",
        expectedShipDate: "2025-10-20",
        transportMode: "海运散货",
        fromLevel: "公共",
        remark: "韩国售后需求，深圳发货",
        sku: "SKU-D",
        skuName: "OpenComm2 UC",
        productCode: "S803-ST-GY-KR-000-ASR",
        availableQty: 0,
        submitQty: 40,
        levels: [
          { level: "德国虚拟仓", planQty: 70, submittedQty: 0 }
        ]
      }
    ];

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pendingQty(level) {
      return Math.max(0, Number(level.planQty || 0) - Number(level.submittedQty || 0));
    }

    function planQty(row) {
      return row.levels.reduce((sum, level) => sum + Number(level.planQty || 0), 0);
    }

    function submittedQty(row) {
      return row.levels.reduce((sum, level) => sum + Number(level.submittedQty || 0), 0);
    }

    function pendingTotal(row) {
      return row.levels.reduce((sum, level) => sum + pendingQty(level), 0);
    }

    function allocateByLargestRemainder(row) {
      const totalPending = pendingTotal(row);
      const target = Math.min(Math.max(Number(row.submitQty || 0), 0), totalPending);

      if (!target || !totalPending) {
        return row.levels.map(level => ({ ...level, allocatedQty: 0, ratio: 0, theory: 0, remainder: 0 }));
      }

      const allocated = row.levels.map((level, index) => {
        const pending = pendingQty(level);
        const ratio = pending / totalPending;
        const theory = target * ratio;
        const base = Math.min(Math.floor(theory), pending);
        return {
          ...level,
          index,
          pendingQty: pending,
          ratio,
          theory,
          allocatedQty: base,
          remainder: theory - Math.floor(theory)
        };
      });

      let left = target - allocated.reduce((sum, item) => sum + item.allocatedQty, 0);
      const sorted = [...allocated].sort((a, b) => {
        if (b.remainder !== a.remainder) return b.remainder - a.remainder;
        return b.pendingQty - a.pendingQty;
      });

      while (left > 0) {
        const targetLevel = sorted.find(item => item.allocatedQty < item.pendingQty);
        if (!targetLevel) break;
        targetLevel.allocatedQty += 1;
        left -= 1;
      }

      return allocated.sort((a, b) => a.index - b.index);
    }

    function receiveLevelSummary(row) {
      return row.levels.map(item => item.level).filter(Boolean).join("，") || "未选择";
    }

    function rowError(row) {
      if (Number(row.submitQty || 0) <= 0) return "本次提交数量必须大于 0";
      if (Number(row.submitQty || 0) > pendingTotal(row)) return `不可超过待提交数量 ${pendingTotal(row)}`;
      if (!row.productCode) return "目的仓第三方产品代码不能为空";
      return "";
    }

    function renderRows() {
      const html = rows.map((row, rowIndex) => {
        const error = rowError(row);
        const allocations = allocateByLargestRemainder(row);
        const main = `
          <tr class="main-row ${row.expanded ? "group-open" : ""} ${error ? "row-error" : ""}" data-row="${rowIndex}">
            <td class="sku-col">
              <button class="expand-btn ${row.expanded ? "expanded" : ""}" data-action="toggle" title="${row.expanded ? "收起" : "展开"}">
                <span class="chevron"></span>
              </button>
              <span class="ellipsis" title="${escapeHtml(row.sku)}">${escapeHtml(row.sku)}</span>
            </td>
            <td class="plan-col">${escapeHtml(row.planNo)}</td>
            <td class="warehouse-col">${escapeHtml(row.fromWarehouse)}</td>
            <td class="warehouse-col">${escapeHtml(row.toWarehouse)}</td>
            <td class="date-col">${escapeHtml(row.expectedShipDate)}</td>
            <td class="mode-col">${escapeHtml(row.transportMode)}</td>
            <td class="level-col">
              <select class="cell-select" disabled><option>${escapeHtml(row.fromLevel)}</option></select>
            </td>
            <td class="level-col">
              <span class="ellipsis" title="${escapeHtml(receiveLevelSummary(row))}">${escapeHtml(receiveLevelSummary(row))}</span>
            </td>
            <td class="qty-col">${pendingTotal(row)}</td>
            <td class="qty-col">${Number(row.availableQty || 0)}</td>
            <td class="qty-col">
              <input class="cell-input num-input" data-field="submitQty" inputmode="numeric" value="${Number(row.submitQty || 0)}" />
              ${error ? `<div class="error-text">${escapeHtml(error)}</div>` : ""}
            </td>
            <td class="remark-col"><span class="ellipsis" title="${escapeHtml(row.remark)}">${escapeHtml(row.remark)}</span></td>
            <td class="wide-col"><span class="ellipsis" title="${escapeHtml(row.productCode)}">${escapeHtml(row.productCode)}</span></td>
          </tr>
        `;
        const children = !row.expanded ? "" : allocations.map(item => `
          <tr class="child-row" data-row="${rowIndex}">
            <td class="sku-col"><span class="child-indent">└ ${escapeHtml(row.sku)}</span></td>
            <td class="plan-col">${escapeHtml(row.planNo)}</td>
            <td class="warehouse-col">${escapeHtml(row.fromWarehouse)}</td>
            <td class="warehouse-col">${escapeHtml(row.toWarehouse)}</td>
            <td class="date-col">${escapeHtml(row.expectedShipDate)}</td>
            <td class="mode-col">${escapeHtml(row.transportMode)}</td>
            <td class="level-col">${escapeHtml(row.fromLevel)}</td>
            <td class="level-col">${escapeHtml(item.level)}</td>
            <td class="qty-col">${pendingQty(item)}</td>
            <td class="qty-col">${Number(row.availableQty || 0)}</td>
            <td class="qty-col"><span class="calc-text">${item.allocatedQty}</span></td>
            <td class="remark-col"><span class="ellipsis" title="${escapeHtml(row.remark)}">${escapeHtml(row.remark)}</span></td>
            <td class="wide-col">${escapeHtml(row.productCode)}</td>
          </tr>
        `).join("");
        return main + children;
      }).join("");

      detailBody.innerHTML = html;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function updateRemarkCount() {
      remarkCount.textContent = `${remark.value.length} / 1000`;
    }

    function commitSubmitInput(input) {
      const tr = input.closest("tr[data-row]");
      if (!tr || input.dataset.field !== "submitQty") return;
      const rowIndex = Number(tr.dataset.row);
      rows[rowIndex].submitQty = Number(input.value.replace(/[^\d]/g, "") || 0);
      renderRows();
    }

    detailBody.addEventListener("input", event => {
      const target = event.target;
      if (target.dataset.field !== "submitQty") return;
      target.value = target.value.replace(/[^\d]/g, "");
    });

    detailBody.addEventListener("change", event => {
      const target = event.target;
      if (target.dataset.field !== "submitQty") return;
      commitSubmitInput(target);
    });

    detailBody.addEventListener("keydown", event => {
      const target = event.target;
      if (target.dataset.field !== "submitQty" || event.key !== "Enter") return;
      event.preventDefault();
      commitSubmitInput(target);
    });

    detailBody.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const tr = button.closest("tr[data-row]");
      if (!tr) return;
      const rowIndex = Number(tr.dataset.row);
      const action = button.dataset.action;

      if (action === "toggle") {
        rows[rowIndex].expanded = !rows[rowIndex].expanded;
        renderRows();
      }
    });

    document.getElementById("expandAll").addEventListener("click", () => {
      rows.forEach(row => { row.expanded = true; });
      renderRows();
    });

    document.getElementById("collapseAll").addEventListener("click", () => {
      rows.forEach(row => { row.expanded = false; });
      renderRows();
    });

    document.getElementById("autoFill").addEventListener("click", () => {
      rows.forEach(row => {
        row.submitQty = pendingTotal(row);
      });
      renderRows();
      showToast("已按各备货计划 + SKU 的待提交数量全量填充。");
    });

    document.getElementById("confirmBtn").addEventListener("click", () => {
      if (document.activeElement && document.activeElement.dataset.field === "submitQty") {
        commitSubmitInput(document.activeElement);
      }

      const invalidRows = rows.filter(row => rowError(row));
      if (invalidRows.length) {
        invalidRows.forEach(row => { row.expanded = true; });
        renderRows();
        showToast(`还有 ${invalidRows.length} 行计划明细未通过校验。`);
        return;
      }

      const skuMap = rows.reduce((map, row) => {
        map[row.sku] = (map[row.sku] || 0) + Number(row.submitQty || 0);
        return map;
      }, {});
      const summary = Object.entries(skuMap).map(([sku, qty]) => `${sku} ${qty}`).join("，");
      showToast(`提交成功：将生成 1 张调拨单和 1 张调拨发货单；SKU 汇总：${summary}。`);
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      showToast("已取消，本原型不会关闭页面。");
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      showToast("已点击关闭，本原型保留弹窗页面展示。");
    });

    remark.addEventListener("input", updateRemarkCount);

    updateRemarkCount();
    renderRows();
  </script>
</body>
</html>
