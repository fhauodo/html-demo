<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新增调拨单 - 调拨明细改造原型</title>
  <style>
    :root {
      --bg: #eef1f6;
      --panel: #fff;
      --line: #e6eaf0;
      --line-strong: #d7dde7;
      --header: #f3f6fa;
      --text: #243042;
      --muted: #7a8494;
      --disabled: #f4f6fa;
      --primary: #246bfe;
      --primary-weak: #eaf1ff;
      --primary-hover: #1b58d6;
      --red: #d9363e;
      --red-weak: #fff2f2;
      --warn: #a35c00;
      --warn-weak: #fff4dc;
      --green: #12805c;
      --green-weak: #e9f7f2;
      --shadow: 0 16px 42px rgba(17, 25, 40, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 12px;
    }

    button,
    input,
    select,
    textarea { font: inherit; }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 18px 10px;
    }

    .dialog {
      width: min(1240px, calc(100vw - 20px));
      max-height: calc(100vh - 36px);
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr) 58px;
      overflow: hidden;
      background: var(--panel);
      border-radius: 1px;
      box-shadow: var(--shadow);
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      font-size: 15px;
      font-weight: 600;
    }

    .close {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #9aa3b2;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .dialog-body {
      overflow: auto;
      padding: 16px 20px 18px;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .section-title::after {
      content: "";
      height: 1px;
      background: var(--line);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(210px, 1fr));
      column-gap: 28px;
      row-gap: 12px;
      align-items: start;
    }

    .field {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .field.wide { grid-column: span 2; }
    .field.full { grid-column: 1 / -1; }

    .label {
      color: #667085;
      text-align: right;
      white-space: nowrap;
    }

    .label.required::before,
    .required::before {
      content: "*";
      margin-right: 2px;
      color: var(--red);
    }

    .control,
    textarea {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      color: #344054;
      padding: 0 9px;
      outline: none;
    }

    textarea {
      height: 42px;
      padding: 8px 10px;
      resize: none;
      line-height: 1.5;
    }

    .control[disabled],
    textarea[disabled] {
      background: var(--disabled);
      color: #8b95a6;
      cursor: not-allowed;
    }

    .control:focus,
    textarea:focus,
    .cell-input:focus,
    .cell-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(36, 107, 254, .12);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #667085;
      white-space: nowrap;
    }

    .pill.info {
      border-color: #b8d7e2;
      background: #e8f7fa;
      color: #0b7285;
    }

    .pill.warn {
      border-color: #f0cd82;
      background: var(--warn-weak);
      color: var(--warn);
    }

    .pill.ok {
      border-color: #b7e2d1;
      background: var(--green-weak);
      color: var(--green);
    }

    .btn {
      height: 30px;
      min-width: 58px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: #fff;
      color: #475467;
      padding: 0 12px;
      cursor: pointer;
    }

    .btn:hover {
      border-color: #b9c1d0;
      color: #1f2937;
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    .btn.ghost { background: #f8fafc; }
    .btn.danger { color: var(--red); }
    .btn.icon {
      min-width: 28px;
      width: 28px;
      padding: 0;
    }

    .table-wrap {
      border: 1px solid var(--line);
      overflow: auto;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1520px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      height: 48px;
      padding: 8px 10px;
      vertical-align: middle;
    }

    th:last-child,
    td:last-child { border-right: 0; }

    thead th {
      background: var(--header);
      color: #313b4b;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    tbody tr:hover td {
      background: #fbfdff;
    }

    .check-col { width: 44px; text-align: center; }
    .sku-col { width: 230px; }
    .name-col { width: 180px; }
    .private-col { width: 150px; }
    .code-col { width: 210px; }
    .stock-col { width: 90px; }
    .qty-col { width: 130px; }
    .action-col { width: 120px; }

    .cell-input,
    .cell-select {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      padding: 0 8px;
      outline: none;
      background: #fff;
      color: #243042;
    }

    .cell-input[disabled],
    .cell-select[disabled] {
      background: var(--disabled);
      color: #8b95a6;
      cursor: not-allowed;
    }

    .sku-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }

    .sku-group-row td {
      background: #f8fbff;
      font-weight: 700;
    }

    .sku-group-row:hover td {
      background: #f1f6ff;
    }

    .channel-child-row td {
      background: #fff;
    }

    .channel-child-row td:first-child,
    .channel-child-row td:nth-child(2) {
      background: #fbfdff;
    }

    .row-error td {
      background: var(--red-weak) !important;
    }

    .expand-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      border-radius: 3px;
      cursor: pointer;
      color: #667085;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 22px;
      padding: 0;
    }

    .expand-btn:hover {
      background: var(--primary-weak);
      color: var(--primary);
    }

    .chevron {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 6px solid currentColor;
      transform: rotate(0deg);
      transition: transform .16s ease;
    }

    .expand-btn.expanded .chevron {
      transform: rotate(90deg);
    }

    .sku-main {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
    }

    .child-indent {
      display: block;
      padding-left: 30px;
      color: #697586;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .qty-stepper {
      display: grid;
      grid-template-columns: 30px 1fr 30px;
      width: 100%;
    }

    .qty-stepper button,
    .qty-stepper input {
      height: 30px;
      border: 1px solid var(--line-strong);
      background: #fff;
    }

    .qty-stepper button {
      cursor: pointer;
      color: #617084;
    }

    .qty-stepper input {
      border-left: 0;
      border-right: 0;
      text-align: center;
      outline: none;
      min-width: 0;
    }

    .error-text {
      margin-top: 4px;
      color: var(--red);
      font-size: 11px;
      white-space: nowrap;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 20px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .footer-left { color: #667085; }
    .footer-actions { display: flex; gap: 10px; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      min-width: 260px;
      max-width: 420px;
      padding: 11px 13px;
      border-radius: 2px;
      background: #111827;
      color: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
      line-height: 1.5;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .18s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <header class="dialog-header">
        <div class="dialog-title" id="dialogTitle">新增调拨单</div>
        <button class="close" type="button" id="closeBtn" title="关闭">×</button>
      </header>

      <main class="dialog-body">
        <section class="section">
          <div class="section-title">基本信息</div>
          <div class="form-grid">
            <label class="field">
              <span class="label">调拨单号：</span>
              <input class="control" value="系统自动生成" disabled />
            </label>
            <label class="field">
              <span class="label required">始发仓：</span>
              <select class="control"><option>成品仓</option><option>江淮成品仓</option></select>
            </label>
            <label class="field">
              <span class="label required">目的仓：</span>
              <select class="control"><option>万邑通德国仓</option><option>德国星马逊仓</option></select>
            </label>
            <label class="field">
              <span class="label required">运输方式：</span>
              <select class="control"><option>汽运零担</option><option>海运散货</option><option>空运</option></select>
            </label>
            <label class="field">
              <span class="label required">期望发货时间：</span>
              <input class="control" type="date" value="2026-05-28" />
            </label>
            <label class="field">
              <span class="label required">期望上架日期：</span>
              <input class="control" type="date" value="2026-06-12" />
            </label>
            <label class="field">
              <span class="label required">状态：</span>
              <select class="control" disabled><option>新建</option></select>
            </label>
            <label class="field full">
              <span class="label">备注：</span>
              <textarea maxlength="200" placeholder="请输入内容"></textarea>
            </label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">目的地信息</div>
          <div class="form-grid">
            <label class="field">
              <span class="label">目的仓入库单号：</span>
              <input class="control" />
            </label>
            <label class="field">
              <span class="label">公司名：</span>
              <input class="control" />
            </label>
            <label class="field">
              <span class="label required">收件人：</span>
              <input class="control" value="Online Seller C/O 3rd Pty Warehouse" />
            </label>
            <label class="field">
              <span class="label required">收件人电话：</span>
              <input class="control" value="0049 1727287134" />
            </label>
            <label class="field">
              <span class="label required">收件人国家/地区：</span>
              <select class="control"><option>德国</option><option>法国</option></select>
            </label>
            <label class="field">
              <span class="label required">城市：</span>
              <input class="control" value="Bremen" />
            </label>
            <label class="field">
              <span class="label">邮编：</span>
              <input class="control" value="28197" />
            </label>
            <label class="field">
              <span class="label">邮箱：</span>
              <input class="control" value="Booking@winit.com.cn" />
            </label>
            <label class="field wide">
              <span class="label required">地址1：</span>
              <input class="control" value="Senator-Blase-StraBe 13" />
            </label>
            <label class="field wide">
              <span class="label">地址2：</span>
              <input class="control" />
            </label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">调拨明细</div>
          <div class="toolbar">
            <div class="toolbar-left">
              <button type="button" class="btn primary" id="addSku">+ 添加产品</button>
              <button type="button" class="btn primary" id="importDemo">导入产品</button>
              <button type="button" class="btn ghost danger" id="removeSelected">批量移除</button>
            </div>
            <div class="toolbar-right">
              <span class="pill info">第一层按 SKU 汇总</span>
              <span class="pill">第二层维护调出/调入渠道库存和调拨数量</span>
              <span class="pill warn">调出渠道库存 + 调入渠道库存 + SKU 不允许重复</span>
              <span class="pill" id="rowCount">0 行明细</span>
              <span class="pill info" id="validState">待校验</span>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="check-col"><input type="checkbox" id="checkAll" /></th>
                  <th class="sku-col"><span class="required">SKU</span></th>
                  <th class="name-col">产品名称</th>
                  <th class="private-col"><span class="required">调出渠道库存</span></th>
                  <th class="private-col"><span class="required">调入渠道库存</span></th>
                  <th class="code-col">始发仓第三方产品代码</th>
                  <th class="code-col"><span class="required">目的仓第三方产品代码</span></th>
                  <th class="stock-col">可用数量</th>
                  <th class="qty-col"><span class="required">调拨数量</span></th>
                  <th class="action-col">操作</th>
                </tr>
              </thead>
              <tbody id="detailBody"></tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="dialog-footer">
        <div class="footer-left">同一 SKU 可按不同调入渠道库存拆多行；保存时校验“调出渠道库存 + 调入渠道库存 + SKU”唯一。</div>
        <div class="footer-actions">
          <button class="btn" type="button" id="cancelBtn">取消</button>
          <button class="btn primary" type="button" id="confirmBtn">确定</button>
        </div>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const privateOptions = ["公共", "法国虚拟仓", "德国虚拟仓", "西班牙虚拟仓", "英国虚拟仓"];
    const products = [
      { sku: "T921-ST-BK-EU-000-AZB", name: "Shokz_OpenFit 2+ Black", outCode: "SRC-T921BK", inCode: "AMZ-DE-T921BK", stock: 360 },
      { sku: "T921-ST-GY-EU-000-AZB", name: "Shokz_OpenFit 2+ Grey", outCode: "SRC-T921GY", inCode: "AMZ-DE-T921GY", stock: 240 },
      { sku: "S810-ST-BL-KR-000-ASR", name: "Shokz_OpenFit Air Black", outCode: "SRC-S810BL", inCode: "AMZ-DE-S810BL", stock: 180 }
    ];

    const detailBody = document.getElementById("detailBody");
    const toast = document.getElementById("toast");
    const expandedSku = new Set(["T921-ST-BK-EU-000-AZB"]);
    let idSeq = 0;

    function createId() {
      idSeq += 1;
      return `row-${Date.now()}-${idSeq}`;
    }

    let rows = [
      {
        id: createId(),
        checked: false,
        sku: "T921-ST-BK-EU-000-AZB",
        name: "Shokz_OpenFit 2+ Black",
        fromPrivate: "公共",
        inPrivate: "法国虚拟仓",
        outCode: "SRC-T921BK",
        inCode: "AMZ-DE-T921BK",
        stock: 360,
        qty: 40
      },
      {
        id: createId(),
        checked: false,
        sku: "T921-ST-BK-EU-000-AZB",
        name: "Shokz_OpenFit 2+ Black",
        fromPrivate: "公共",
        inPrivate: "德国虚拟仓",
        outCode: "SRC-T921BK",
        inCode: "AMZ-DE-T921BK",
        stock: 360,
        qty: 32
      },
      {
        id: createId(),
        checked: false,
        sku: "T921-ST-GY-EU-000-AZB",
        name: "Shokz_OpenFit 2+ Grey",
        fromPrivate: "公共",
        inPrivate: "德国虚拟仓",
        outCode: "SRC-T921GY",
        inCode: "AMZ-DE-T921GY",
        stock: 240,
        qty: 72
      }
    ];

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function rowGroupKey(row) {
      return row.sku || row.id;
    }

    function getGroups() {
      const grouped = rows.reduce((map, row) => {
        const key = rowGroupKey(row);
        if (!map[key]) {
          map[key] = {
            key,
            sku: row.sku,
            name: row.name,
            outCode: row.outCode,
            inCode: row.inCode,
            stock: row.stock,
            total: 0,
            rows: []
          };
        }
        map[key].total += Number(row.qty || 0);
        map[key].rows.push(row);
        return map;
      }, {});
      return Object.values(grouped);
    }

    function getDuplicateKeys() {
      const seen = new Map();
      const duplicates = new Set();
      rows.forEach(row => {
        const key = `${row.fromPrivate}__${row.inPrivate}__${row.sku}`;
        if (seen.has(key)) duplicates.add(key);
        seen.set(key, true);
      });
      return duplicates;
    }

    function validateRows() {
      const duplicates = getDuplicateKeys();
      const errors = new Map();
      rows.forEach(row => {
        const itemErrors = [];
        if (!row.sku) itemErrors.push("SKU不能为空");
        if (!row.fromPrivate) itemErrors.push("调出渠道库存不能为空");
        if (!row.inPrivate) itemErrors.push("调入渠道库存不能为空");
        if (!row.inCode) itemErrors.push("目的仓第三方产品代码不能为空");
        if (!row.qty || Number(row.qty) <= 0) itemErrors.push("调拨数量必须大于0");
        if (duplicates.has(`${row.fromPrivate}__${row.inPrivate}__${row.sku}`)) {
          itemErrors.push("调出渠道库存+调入渠道库存+SKU重复");
        }
        if (itemErrors.length) errors.set(row.id, itemErrors[0]);
      });
      return errors;
    }

    function channelSummary(group, field) {
      return Array.from(new Set(group.rows.map(row => row[field]).filter(Boolean))).join("，") || "未选择";
    }

    function renderRows() {
      const errors = validateRows();
      detailBody.innerHTML = getGroups().map(group => {
        const groupHasError = group.rows.some(row => errors.has(row.id));
        const groupChecked = group.rows.every(row => row.checked);
        const expanded = expandedSku.has(group.key);
        const parentRow = `
          <tr class="sku-group-row ${groupHasError ? "row-error" : ""}" data-group-key="${escapeHtml(group.key)}">
            <td class="check-col"><input type="checkbox" data-action="checkSku" ${groupChecked ? "checked" : ""} /></td>
            <td class="sku-col">
              <div class="sku-main">
                <button class="expand-btn ${expanded ? "expanded" : ""}" data-action="toggleSku" title="${expanded ? "收起" : "展开"}">
                  <span class="chevron"></span>
                </button>
                <select class="cell-select" data-field="groupSku" data-group-key="${escapeHtml(group.key)}">
                  ${products.map(product => `<option value="${escapeHtml(product.sku)}" ${product.sku === group.sku ? "selected" : ""}>${escapeHtml(product.sku)}</option>`).join("")}
                </select>
              </div>
            </td>
            <td class="name-col"><span class="sku-text" title="${escapeHtml(group.name)}">${escapeHtml(group.name)}</span></td>
            <td class="private-col"><span class="sku-text" title="${escapeHtml(channelSummary(group, "fromPrivate"))}">${escapeHtml(channelSummary(group, "fromPrivate"))}</span></td>
            <td class="private-col"><span class="sku-text" title="${escapeHtml(channelSummary(group, "inPrivate"))}">${escapeHtml(channelSummary(group, "inPrivate"))}</span></td>
            <td class="code-col"><span class="sku-text" title="${escapeHtml(group.outCode)}">${escapeHtml(group.outCode)}</span></td>
            <td class="code-col"><span class="sku-text" title="${escapeHtml(group.inCode)}">${escapeHtml(group.inCode)}</span></td>
            <td class="stock-col">${Number(group.stock) || 0}</td>
            <td class="qty-col"><span class="sku-text">${group.total}</span></td>
            <td class="action-col">
              <div class="action-group">
                <button class="btn icon" type="button" data-action="addChannel" title="新增调入渠道库存">＋</button>
                <button class="btn icon" type="button" data-action="deleteSku" title="删除SKU">×</button>
              </div>
            </td>
          </tr>
        `;
        const childRows = !expanded ? "" : group.rows.map(row => {
          const error = errors.get(row.id);
          return `
            <tr class="channel-child-row ${error ? "row-error" : ""}" data-id="${escapeHtml(row.id)}" data-group-key="${escapeHtml(group.key)}">
              <td class="check-col"><input type="checkbox" data-action="check" ${row.checked ? "checked" : ""} /></td>
              <td class="sku-col">
                <span class="child-indent" title="${escapeHtml(row.sku)}">└ ${escapeHtml(row.sku)}</span>
                ${error ? `<div class="error-text" title="${escapeHtml(error)}">${escapeHtml(error)}</div>` : ""}
              </td>
              <td class="name-col"><span class="sku-text" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</span></td>
              <td class="private-col">
                <select class="cell-select" data-field="fromPrivate">
                  ${privateOptions.map(item => `<option ${item === row.fromPrivate ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
                </select>
              </td>
              <td class="private-col">
                <select class="cell-select" data-field="inPrivate">
                  ${privateOptions.map(item => `<option ${item === row.inPrivate ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
                </select>
              </td>
              <td class="code-col"><span class="sku-text" title="${escapeHtml(row.outCode)}">${escapeHtml(row.outCode)}</span></td>
              <td class="code-col"><span class="sku-text" title="${escapeHtml(row.inCode)}">${escapeHtml(row.inCode)}</span></td>
              <td class="stock-col">${Number(row.stock) || 0}</td>
              <td class="qty-col">
                <div class="qty-stepper">
                  <button type="button" data-action="minus">−</button>
                  <input data-field="qty" inputmode="numeric" value="${Number(row.qty) || 0}" />
                  <button type="button" data-action="plus">＋</button>
                </div>
              </td>
              <td class="action-col">
                <div class="action-group">
                  <button class="btn icon" type="button" data-action="delete" title="删除渠道库存明细">×</button>
                </div>
              </td>
            </tr>
          `;
        }).join("");
        return parentRow + childRows;
      }).join("");

      document.getElementById("rowCount").textContent = `${rows.length} 行明细`;
      document.getElementById("checkAll").checked = rows.length > 0 && rows.every(row => row.checked);
      document.getElementById("validState").textContent = errors.size ? `${errors.size} 行待处理` : "校验通过";
      document.getElementById("validState").className = errors.size ? "pill warn" : "pill info";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function updateRow(id, patch) {
      rows = rows.map(row => row.id === id ? { ...row, ...patch } : row);
      renderRows();
    }

    function commitQtyInput(input) {
      const tr = input.closest("tr[data-id]");
      if (!tr || input.dataset.field !== "qty") return;
      const value = Number(input.value.replace(/[^\d]/g, "") || 0);
      updateRow(tr.dataset.id, { qty: value });
    }

    function applyProductToGroup(groupKey, sku) {
      const product = products.find(item => item.sku === sku);
      if (!product) return;
      rows = rows.map(row => {
        if (rowGroupKey(row) !== groupKey) return row;
        return {
          ...row,
          sku: product.sku,
          name: product.name,
          outCode: product.outCode,
          inCode: product.inCode,
          stock: product.stock
        };
      });
      expandedSku.delete(groupKey);
      expandedSku.add(sku);
      renderRows();
    }

    function nextAvailableInPrivate(sku, fromPrivate) {
      const used = new Set(rows.filter(row => row.sku === sku && row.fromPrivate === fromPrivate).map(row => row.inPrivate));
      return privateOptions.find(item => !used.has(item)) || privateOptions[0];
    }

    function addRow(product = products[0], fromPrivate = "公共", inPrivate = "法国虚拟仓", qty = 1) {
      rows.push({
        id: createId(),
        checked: false,
        sku: product.sku,
        name: product.name,
        fromPrivate,
        inPrivate,
        outCode: product.outCode,
        inCode: product.inCode,
        stock: product.stock,
        qty
      });
      expandedSku.add(product.sku);
    }

    detailBody.addEventListener("input", event => {
      const target = event.target;
      if (target.dataset.field !== "qty") return;
      target.value = target.value.replace(/[^\d]/g, "");
    });

    detailBody.addEventListener("change", event => {
      const target = event.target;
      const parent = target.closest("tr[data-group-key]");
      const child = target.closest("tr[data-id]");

      if (target.dataset.action === "checkSku" && parent) {
        rows = rows.map(row => rowGroupKey(row) === parent.dataset.groupKey ? { ...row, checked: target.checked } : row);
        renderRows();
        return;
      }

      if (target.dataset.action === "check" && child) {
        updateRow(child.dataset.id, { checked: target.checked });
        return;
      }

      if (target.dataset.field === "groupSku" && parent) {
        applyProductToGroup(target.dataset.groupKey, target.value);
        return;
      }

      if (target.dataset.field === "qty" && child) {
        commitQtyInput(target);
        return;
      }

      if (target.dataset.field && child) {
        updateRow(child.dataset.id, { [target.dataset.field]: target.value });
      }
    });

    detailBody.addEventListener("keydown", event => {
      if (event.target.dataset.field !== "qty" || event.key !== "Enter") return;
      event.preventDefault();
      commitQtyInput(event.target);
    });

    detailBody.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const parent = button.closest("tr[data-group-key]");
      const child = button.closest("tr[data-id]");
      const groupKey = parent ? parent.dataset.groupKey : "";
      const id = child ? child.dataset.id : "";

      if (action === "toggleSku") {
        expandedSku.has(groupKey) ? expandedSku.delete(groupKey) : expandedSku.add(groupKey);
        renderRows();
        return;
      }

      if (action === "addChannel") {
        const first = rows.find(row => rowGroupKey(row) === groupKey);
        if (!first) return;
        rows.push({
          ...first,
          id: createId(),
          checked: false,
          inPrivate: nextAvailableInPrivate(first.sku, first.fromPrivate),
          qty: 1
        });
        expandedSku.add(groupKey);
        renderRows();
        showToast("已新增该 SKU 的调入渠道库存明细。");
        return;
      }

      if (action === "deleteSku") {
        const count = rows.filter(row => rowGroupKey(row) === groupKey).length;
        rows = rows.filter(row => rowGroupKey(row) !== groupKey);
        expandedSku.delete(groupKey);
        renderRows();
        showToast(`已删除 ${count} 行调拨明细。`);
        return;
      }

      const row = rows.find(item => item.id === id);
      if (!row) return;

      if (action === "minus") {
        updateRow(id, { qty: Math.max(0, Number(row.qty || 0) - 1) });
      }

      if (action === "plus") {
        updateRow(id, { qty: Number(row.qty || 0) + 1 });
      }

      if (action === "delete") {
        rows = rows.filter(item => item.id !== id);
        if (!rows.some(item => item.sku === row.sku)) expandedSku.delete(row.sku);
        renderRows();
      }
    });

    document.getElementById("checkAll").addEventListener("change", event => {
      rows = rows.map(row => ({ ...row, checked: event.target.checked }));
      renderRows();
    });

    document.getElementById("addSku").addEventListener("click", () => {
      const product = products.find(item => !rows.some(row => row.sku === item.sku)) || products[0];
      addRow(product, "公共", nextAvailableInPrivate(product.sku, "公共"), 1);
      renderRows();
      showToast("已新增 SKU，请展开维护调出/调入渠道库存和调拨数量。");
    });

    document.getElementById("importDemo").addEventListener("click", () => {
      addRow(products[1], "公共", "西班牙虚拟仓", 24);
      addRow(products[2], "公共", "英国虚拟仓", 36);
      renderRows();
      showToast("已导入示例产品，支持同 SKU 按不同调入渠道库存拆行。");
    });

    document.getElementById("removeSelected").addEventListener("click", () => {
      const count = rows.filter(row => row.checked).length;
      rows = rows.filter(row => !row.checked);
      renderRows();
      showToast(count ? `已移除 ${count} 行明细。` : "请先选择需要移除的明细。");
    });

    document.getElementById("confirmBtn").addEventListener("click", () => {
      if (document.activeElement && document.activeElement.dataset.field === "qty") {
        commitQtyInput(document.activeElement);
      }
      const errors = validateRows();
      if (errors.size) {
        rows.forEach(row => expandedSku.add(rowGroupKey(row)));
        renderRows();
        showToast(`还有 ${errors.size} 行调拨明细未通过校验。`);
        return;
      }
      const total = rows.reduce((sum, row) => sum + Number(row.qty || 0), 0);
      showToast(`保存成功：共 ${rows.length} 行调拨明细，调拨数量合计 ${total}。`);
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      showToast("已取消，本原型不会关闭页面。");
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      showToast("已点击关闭，本原型保留弹窗页面展示。");
    });

    renderRows();
  </script>
</body>
</html>
